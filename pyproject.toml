[project]
name = "biocompute"
version = "0.1.0"
description = "A simulated organoid biocomputer (spiking culture on a multi-electrode array) driving Asimov 1 in MuJoCo"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6",
  "mujoco>=3.2",
  "onnxruntime>=1.18",
  "torch>=2.3",
  "matplotlib>=3.8",
  "h5py>=3.16.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biocompute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
